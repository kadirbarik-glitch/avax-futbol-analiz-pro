name: AVAX Super Lig API Access Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  super-lig-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Turkish competitions
        env:
          FOOTBALL_DATA_API_KEY: $&#123;&#123; secrets.FOOTBALL_DATA_API_KEY &#125;&#125;
        run: |
          python - &lt;&lt;'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          token = os.environ.get('FOOTBALL_DATA_API_KEY', '').strip()
          if not token:
              raise SystemExit('API secret missing')

          request = urllib.request.Request(
              'https://api.football-data.org/v4/competitions',
              headers={'X-Auth-Token': token},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit('API HTTP status: ' + str(error.code))
          except (urllib.error.URLError, TimeoutError, ValueError):
              raise SystemExit('API request failed')

          competitions = data.get('competitions', [])
          if not isinstance(competitions, list):
              raise SystemExit('Invalid API response')

          found = []
          for competition in competitions:
              area = competition.get('area') or {}
              country = str(area.get('name', '')).casefold()
              code = str(area.get('code', '')).upper()
              name = str(competition.get('name', '')).casefold()
              if code in ('TUR', 'TR') or country in ('turkey', 'türkiye') or 'super lig' in name or 'süper lig' in name:
                  found.append(competition)

          print('Accessible competition count:', len(competitions))
          if found:
              print('RESULT: TURKISH_COMPETITION_VISIBLE')
              for competition in found:
                  print('Competition:', competition.get('code'), competition.get('name'))
          else:
              print('RESULT: TURKISH_COMPETITION_NOT_LISTED')
          print('Model validation not performed')
          PY
