
name: AVAX V8.2 Champions League Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gereksinimleri kur
        run: python -m pip install -r requirements.txt

      - name: V8.2 kodunu kontrol et
        run: python -m py_compile backtest_v82.py

      - name: Gecmis verileri geri yukle
        uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: avax-v82-cl-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            avax-v82-cl-${{ runner.os }}-
            avax-v73-data-${{ runner.os }}-

      - name: Sampiyonlar Ligi veri arastirmasi
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python backtest_v82.py

      - name: Verileri onbellege kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data_cache
          key: avax-v82-cl-${{ runner.os }}-${{ github.run_id }}
