name: AVAX V8.2 Champions League Research

on:
  workflow_dispatch:
    inputs:
      download:
        description: 'Eksik CL cache sezonlarini API ile indir'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gereksinimleri kur
        run: python -m pip install -r requirements.txt

      - name: Python kodlarini kontrol et
        run: |
          python -m py_compile backtest_v82.py
          python -m py_compile backtest_v82_models.py
          python -m py_compile backtest_v6.py
          python -m py_compile backtest_v7.py
          python -m py_compile v8_models.py
          python -m py_compile v8_live_engine.py
          python -m py_compile v8_data.py
          python -m py_compile test_v82_integrity.py
          python -m py_compile test_v82_real_data.py
          python -m py_compile test_v82_live.py
          python -m py_compile test_v82_api_integration.py
          python -m py_compile test_v82_backtest_parity.py

      - name: V8.2 veri sizintisi ve siralama testleri
        run: python -m unittest -v test_v82_integrity

      - name: V8.2 canli motor testleri
        run: python -m unittest -v test_v82_live

      - name: V8.2 API baglanti testleri
        run: python -m unittest -v test_v82_api_integration

      - name: Gecmis verileri geri yukle
        uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: avax-v82-cl-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            avax-v82-cl-${{ runner.os }}-
            avax-v73-data-${{ runner.os }}-

      - name: Sampiyonlar Ligi veri arastirmasi
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ "${{ inputs.download }}" = "true" ]; then
            python backtest_v82.py --download
          else
            python backtest_v82.py
          fi

      - name: V8.2 gercek veri guvenilirlik testi
        run: python test_v82_real_data.py --require-manifest

      - name: V8.2 model karsilastirmasi
        run: python backtest_v82_models.py

      - name: V8.2 backtest canli motor uyum testi
        env:
          REQUIRE_CL_CACHE: '1'
        run: python -m unittest -v test_v82_backtest_parity

      - name: Verileri onbellege kaydet
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data_cache
          key: avax-v82-cl-${{ runner.os }}-${{ github.run_id }}
