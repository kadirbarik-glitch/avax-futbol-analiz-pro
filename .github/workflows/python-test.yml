
name: AVAX V8 Test.

on:
  workflow_dispatch:
  push:
    branches:
      - v3-gelistirme
      - codex-v83-gelistirme
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: avax-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gereksinimleri kur
        run: python -m pip install -r requirements.txt

      - name: Veri onbellegini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: avax-v73-data-${{ runner.os }}-${{ hashFiles('backtest_v73.py') }}-${{ github.run_id }}
          restore-keys: |
            avax-v73-data-${{ runner.os }}-${{ hashFiles('backtest_v73.py') }}-
            avax-v73-data-${{ runner.os }}-

      - name: Python kodlarini kontrol et
        run: |
          python -m compileall -q \
            app_v3.py app_v8.py \
            v8_models.py v8_live_engine.py v8_data.py \
            test_v8_data.py \
            backtest_v6.py backtest_v7.py \
            backtest_v73.py backtest_v8.py \
            v84_data_providers.py v84_superlig_import.py \
            v84_daily_fixtures.py \
            test_v84_daily_fixtures.py \
            test_v84_date_boundaries.py \
            v84_daily_live_check.py \
            v84_daily_app.py \
            test_v84_daily_app.py \
            test_v84_kickoff_safety.py \
            v84_analysis_bridge.py \
            test_v84_analysis_bridge.py \
            v84_team_mapping.py \
            test_v84_team_mapping.py

      - name: V8 model secimlerini kontrol et
        run: |
          python - <<'PY'
          from v8_models import MODEL_SELECTIONS, MARKETS
          from v8_models import get_model, get_league_models
          from backtest_v7 import CONFIGS

          expected_leagues = {
              "PL", "PD", "SA", "BL1", "FL1", "CL"
          }
          assert set(MODEL_SELECTIONS) == expected_leagues

          for league in MODEL_SELECTIONS:
              models = get_league_models(league)
              assert set(models) == set(MARKETS)

              for market in MARKETS:
                  model = get_model(league, market)

                  if model.startswith("V6_"):
                      weight = float(model[3:])
                      assert weight in (0, 0.25, 0.5, 0.75, 1)
                  else:
                      assert model.startswith("V7_")
                      index = int(model[3:])
                      assert 0 <= index < len(CONFIGS)

          print("V8 model secimleri basarili")
          PY

      - name: V8 Beta uygulama acilis testi
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from app_v8 import app

          client = app.test_client()

          response = client.get("/v8/status")
          assert response.status_code == 200

          data = response.get_json()
          assert data["version"] == "8.3-beta"
          assert data["status"] == "beta"
          assert set(data["supported_leagues"]) == {
              "PL", "PD", "SA", "BL1", "FL1", "CL"
          }
          assert data["live_odds_included"] is False

          with patch(
              "app_v8.api_get",
              return_value=({"matches": []}, None)
          ):
              response = client.get("/v8")

          assert response.status_code == 200
          assert b"AVAX FUTBOL ANALIZ PRO V8" in response.data

          print("V8 Beta panel acilis testi basarili")
          PY

      - name: V8 canli motor cevrimdisi testi
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from v8_live_engine import build_histories, predict

          start = datetime(
              2025, 1, 1, tzinfo=timezone.utc
          )
          matches = []
          match_id = 1

          for round_no in range(10):
              for i in range(6):
                  home = (i + round_no) % 6 + 1
                  away = (i + round_no + 1) % 6 + 7

                  kickoff = (
                      start + timedelta(days=round_no)
                  ).isoformat()

                  matches.append({
                      "id": match_id,
                      "utcDate": kickoff,
                      "status": "FINISHED",
                      "homeTeam": {"id": home},
                      "awayTeam": {"id": away},
                      "score": {
                          "fullTime": {
                              "home": (i + round_no) % 4,
                              "away": (i + 1) % 3,
                          }
                      },
                  })
                  match_id += 1

          cutoff = (
              start + timedelta(days=11)
          ).isoformat()

          original = build_histories(matches, cutoff)
          reversed_data = build_histories(
              list(reversed(matches)), cutoff
          )

          assert original == reversed_data, (
              "Mac siralamasi sonucu degistirdi"
          )

          future = {
              **matches[0],
              "id": 9999,
              "utcDate": (
                  start + timedelta(days=20)
              ).isoformat(),
              "score": {
                  "fullTime": {"home": 20, "away": 0}
              },
          }

          with_future = build_histories(
              matches + [future], cutoff
          )

          assert original == with_future, (
              "Gelecek mac sonucu hesaplamaya sizdi"
          )

          for league in ("PL", "PD", "SA", "BL1", "FL1", "CL"):
              result = predict(
                  league, 1, 7, cutoff, matches
              )
              probs = result["probabilities_percent"]

              assert all(
                  0 <= value <= 100
                  for value in probs.values()
              )

              assert abs(
                  probs["home"] + probs["draw"]
                  + probs["away"] - 100
              ) < 0.1

              assert abs(
                  probs["over25"] + probs["under25"]
                  - 100
              ) < 0.01

              assert abs(
                  probs["btts"] + probs["no_btts"]
                  - 100
              ) < 0.01

              assert len(result["models"]) == 3

          print("V8 canli motor testleri basarili")
          PY

      - name: V8 veri baglantisi cevrimdisi testi
        run: python -m unittest -v test_v8_data.py

      - name: CL cevrimdisi motor ve parite testleri
        run: |
          python -m unittest -v \
            test_v82_integrity \
            test_v82_live \
            test_v82_api_integration \
            test_v82_cache_controls \
            test_v82_cl_parity_fixture \
            test_v83_league_catalog \
            test_v83_dynamic_leagues

      - name: V8 model secimi ve performans testi
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python backtest_v8.py

      - name: Veri onbellegini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data_cache
          key: avax-v73-data-${{ runner.os }}-${{ hashFiles('backtest_v73.py') }}-${{ github.run_id }}

      - name: Turkiye Super Lig API erisim testi
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python -c "import os,urllib.request,json; token=os.environ.get('FOOTBALL_DATA_API_KEY',''); assert token, 'API key missing'; req=urllib.request.Request('https://api.football-data.org/v4/competitions',headers={'X-Auth-Token':token}); data=json.load(urllib.request.urlopen(req,timeout=20)); leagues=data.get('competitions',[]); found=[x for x in leagues if (x.get('area') or {}).get('code') in ('TUR','TR') or 'turkey' in str((x.get('area') or {}).get('name','')).lower() or 'super lig' in str(x.get('name','')).lower()]; print('Turkish competitions:',[(x.get('code'),x.get('name')) for x in found]); print('RESULT:', 'VISIBLE' if found else 'NOT_LISTED')"

      - name: AVAX V8.4 veri saglayici gunluk mac ve arayuz testleri
        run: |
          python -m unittest -v \
            test_v84_data_providers \
            test_v84_daily_fixtures \
            test_v84_date_boundaries \
            test_v84_daily_app \
            test_v84_kickoff_safety \
            test_v84_analysis_bridge \
            test_v84_team_mapping

      - name: AVAX V8.4 Super Lig historical import
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/codex-v83-gelistirme' &&
          github.event.head_commit.message == 'AVAX-V84-IMPORT-ONCE'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python v84_superlig_import.py

      - name: Save Super Lig historical data
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/codex-v83-gelistirme' &&
          github.event.head_commit.message == 'AVAX-V84-IMPORT-ONCE'
        uses: actions/upload-artifact@v4
        with:
          name: avax-v84-superlig-historical
          path: data_cache/superlig_v84/*.json
          retention-days: 7
          if-no-files-found: error

      - name: AVAX V8.4 Daily Live Once
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/codex-v83-gelistirme' &&
          github.event.head_commit.message == 'AVAX-V84-DAILY-LIVE-ONCE'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python v84_daily_live_check.py
