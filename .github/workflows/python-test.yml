name: AVAX V8 Test

on:
  workflow_dispatch:
  push:
    branches:
      - v3-gelistirme
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: avax-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gereksinimleri kur
        run: |
          python -m pip install -r requirements.txt

      - name: Veri onbellegini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: avax-v73-data-${{ runner.os }}-${{ hashFiles('backtest_v73.py') }}-${{ github.run_id }}
          restore-keys: |
            avax-v73-data-${{ runner.os }}-${{ hashFiles('backtest_v73.py') }}-
            avax-v73-data-${{ runner.os }}-

      - name: Python kodlarini kontrol et
        run: |
          python -m py_compile backtest_v8.py
          python -m py_compile backtest_v73.py
          python -m py_compile backtest_v7.py
          python -m py_compile backtest_v6.py

      - name: V8 model secimi ve performans testi
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python backtest_v8.py

      - name: Veri onbellegini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data_cache
          key: avax-v73-data-${{ runner.os }}-${{ hashFiles('backtest_v73.py') }}-${{ github.run_id }}
