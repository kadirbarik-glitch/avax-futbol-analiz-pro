name: AVAX V3 Test

on:
  workflow_dispatch:
  push:
    branches: [v3-gelistirme]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gereksinimleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python kodlarini kontrol et
        run: |
          python -m py_compile app.py mac_verileri.py app_v3.py backtest_v3.py backtest_v4.py backtest_v5.py

      - name: Flask uygulamasini kontrol et
        run: |
          python -c "from app import app; assert app is not None"
          
      
      - name: V3 gecmis mac performans testi
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python backtest_v3.py

      - name: V4 bes lig performans testi
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python backtest_v4.py


