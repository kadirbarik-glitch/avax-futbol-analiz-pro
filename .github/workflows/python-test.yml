
name: AVAX V8 Test

on:
  workflow_dispatch:
  push:
    branches:
      - v3-gelistirme
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: avax-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gereksinimleri kur
        run: python -m pip install -r requirements.txt

      - name: Veri onbellegini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: avax-v73-data-${{ runner.os }}-${{ hashFiles('backtest_v73.py') }}-${{ github.run_id }}
          restore-keys: |
            avax-v73-data-${{ runner.os }}-${{ hashFiles('backtest_v73.py') }}-
            avax-v73-data-${{ runner.os }}-

      - name: Python kodlarini kontrol et
        run: |
          python -m py_compile app_v3.py app_v8.py
          python -m py_compile v8_models.py
          python -m py_compile backtest_v6.py
          python -m py_compile backtest_v7.py
          python -m py_compile backtest_v73.py
          python -m py_compile backtest_v8.py

      - name: V8 model secimlerini kontrol et
        run: |
          python - <<'PY'
          from v8_models import MODEL_SELECTIONS, MARKETS, get_model, get_league_models

          assert len(MODEL_SELECTIONS) == 5

          for league in MODEL_SELECTIONS:
              models = get_league_models(league)
              assert set(models) == set(MARKETS)

              for market in MARKETS:
                  model = get_model(league, market)
                  assert model.startswith(("V6_", "V7_"))

          assert get_model("PL", "match_result") == "V6_0.75"
          assert get_model("BL1", "over25") == "V6_1.00"

          print("AVAX V8 model secimleri basarili")
          PY

      - name: V8 uygulama acilis testi
        run: |
          python - <<'PY'
          from app_v8 import app

          client = app.test_client()
          response = client.get("/v8/status")

          assert response.status_code == 200
          data = response.get_json()

          assert data["version"] == "8.0-hazirlik"
          assert data["status"] == "ready"
          assert data["v8_model_integrated"] is False

          print("AVAX V8 uygulama acilis testi basarili")
          PY

      - name: V8 model secimi ve performans testi
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python backtest_v8.py

      - name: Veri onbellegini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data_cache
          key: avax-v73-data-${{ runner.os }}-${{ hashFiles('backtest_v73.py') }}-${{ github.run_id }}
